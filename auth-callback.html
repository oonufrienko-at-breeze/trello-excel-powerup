<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Trello Auth — Excel Preview</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #172b4d;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .box {
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { color: #1D6F42; margin-top: 0; font-size: 22px; }
  .ok  { color: #1D6F42; }
  .err { color: #d63031; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 12px; word-break: break-all; }
  .hint { color: #5e6c84; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Обробка авторизації...</h1>
  <p id="msg">Зачекайте секунду.</p>
  <p class="hint" id="hint"></p>
</div>
<script>
(function() {
  // Trello передає токен у URL fragment (hash) як "#token=..."
  var hash = window.location.hash || '';
  var token = '';
  // Trello-токени бувають різних форматів: довгий hex (40+) або
  // сучасний ATTA-префікс з буквами+цифрами (~64–80 чар)
  var m = hash.match(/[#&]token=([A-Za-z0-9_\-]+)/);
  if (m) token = m[1];

  var titleEl = document.getElementById('title');
  var msgEl   = document.getElementById('msg');
  var hintEl  = document.getElementById('hint');

  if (token) {
    try {
      // Зберігаємо токен у localStorage під ключем що читає section.html
      localStorage.setItem('trelloExcelPreview_userToken', token);
      localStorage.setItem('trelloExcelPreview_userTokenAt', String(Date.now()));
    } catch(e) {
      titleEl.className = 'err';
      titleEl.textContent = 'Помилка збереження токена';
      msgEl.textContent = e.message;
      return;
    }
    titleEl.className = 'ok';
    titleEl.textContent = '✓ Авторизацію виконано';
    msgEl.innerHTML = 'Токен збережено. Поверніться на Trello-картку та натисніть кнопку <b>Excel Preview</b>.';
    hintEl.textContent = 'Цю вкладку можна закрити.';
    // Спробуємо самозакритися (працює якщо вкладка відкрита через window.open з тієї ж домени)
    setTimeout(function() {
      try { window.close(); } catch(e) {}
    }, 1500);
  } else {
    titleEl.className = 'err';
    titleEl.textContent = '✗ Токен не отримано';
    msgEl.textContent = 'Trello не повернув токен. Можливо, ви скасували авторизацію.';
    hintEl.innerHTML = 'URL: <code>' + (window.location.href.slice(0, 200)) + '</code>';
  }
})();
</script>
</body>
</html>
