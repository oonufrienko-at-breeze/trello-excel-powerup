<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">
<div id="attachment-list"></div>
<script>
(function () {
  var APP_KEY = 'eaa6d0d7c57218139af1b772bbd777cb';
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  var t = TrelloPowerUp.iframe({
    appKey: APP_KEY,
    appName: 'Excel Preview'
  });

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    var chunkSize = 8192;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function setStatus(btn, msg, disabled) {
    btn.textContent = msg;
    btn.disabled = !!disabled;
  }

  function doFetch(file, btn, token) {
    setStatus(btn, 'Downloading...', true);
    var url = file.url;
    url = url.replace('https://trello.com/1/', 'https://api.trello.com/1/');
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    var fetchUrl = url + sep + 'token=' + encodeURIComponent(token) + '&key=' + APP_KEY;

    fetch(fetchUrl, { credentials: 'omit' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(function (buffer) {
        var key = 'excel_preview_' + file.id;
        localStorage.setItem(key, arrayBufferToBase64(buffer));
        setStatus(btn, 'Open preview', false);
        t.modal({
          url: POWERUP_BASE_URL + '/viewer.html'
            + '?dataKey=' + encodeURIComponent(key)
            + '&name=' + encodeURIComponent(file.name),
          accentColor: '#217346',
          height: 800,
          title: file.name
        });
      })
      .catch(function (err) {
        setStatus(btn, 'Error: ' + err.message, false);
        setTimeout(function () { setStatus(btn, 'Open preview', false); }, 3000);
      });
  }

  function openPreview(file, btn) {
    setStatus(btn, 'Loading...', true);

    /* Read token cached by connector in board/private/authToken */
    t.get('board', 'private', 'authToken')
      .then(function (token) {
        if (token) {
          doFetch(file, btn, token);
        } else {
          /* Token not cached yet — show message to use card button */
          setStatus(btn, 'Use card button first', false);
          setTimeout(function () { setStatus(btn, 'Open preview', false); }, 3000);
        }
      })
      .catch(function (err) {
        setStatus(btn, 'Auth error', false);
        setTimeout(function () { setStatus(btn, 'Open preview', false); }, 3000);
      });
  }

  t.render(function () {
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (att) {
        return isExcel(att.name);
      });
      var container = document.getElementById('attachment-list');
      container.innerHTML = '';
      excelFiles.forEach(function (file) {
        var row = document.createElement('div');
        row.className = 'section-row';
        var icon = document.createElement('img');
        icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
        icon.className = 'section-icon';
        icon.alt = '';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = file.name;
        var btn = document.createElement('button');
        btn.className = 'section-preview-btn';
        btn.textContent = 'Open preview';
        btn.addEventListener('click', function () {
          openPreview(file, btn);
        });
        row.appendChild(icon);
        row.appendChild(nameSpan);
        row.appendChild(btn);
        container.appendChild(row);
      });
      t.sizeTo('#attachment-list').catch(function () {});
    });
  });
})();
</script>
</body>
</html>
