<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">
<div id="attachment-list"></div>
<script>
(function () {
  var APP_KEY = 'eaa6d0d7c57218139af1b772bbd777cb';
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  var t = TrelloPowerUp.iframe({
    appKey: APP_KEY,
    appName: 'Excel Preview'
  });

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  function fetchAndOpenPreview(file, btn, token) {
    btn.disabled = true;
    btn.textContent = 'Loading...';

    var url = file.url;
    // Ensure we use api.trello.com
    url = url.replace('https://trello.com/1/', 'https://api.trello.com/1/');
    // Append token as query param as fallback
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    var fetchUrl = url + sep + 'token=' + token + '&key=' + APP_KEY;

    fetch(fetchUrl, { credentials: 'omit' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.arrayBuffer();
      })
      .then(function (buffer) {
        var key = 'excel_preview_' + file.id;
        localStorage.setItem(key, arrayBufferToBase64(buffer));
        t.modal({
          url: POWERUP_BASE_URL + '/viewer.html'
            + '?dataKey=' + encodeURIComponent(key)
            + '&name=' + encodeURIComponent(file.name),
          accentColor: '#217346',
          height: 800,
          title: file.name
        });
        btn.disabled = false;
        btn.textContent = 'Open preview';
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Open preview';
        console.error('[ExcelPreview] fetch error:', err);
        alert('Could not load preview: ' + (err.message || 'Unknown error'));
      });
  }

  function getTokenAndPreview(file, btn) {
    btn.disabled = true;
    btn.textContent = 'Loading...';

    // Try to get stored token first
    t.get('member', 'private', 'token')
      .then(function (token) {
        if (token) {
          fetchAndOpenPreview(file, btn, token);
        } else {
          // Need to authorize
          btn.disabled = false;
          btn.textContent = 'Open preview';
          t.getRestApi()
            .then(function (api) {
              return api.authorize({ scope: 'read' });
            })
            .then(function () {
              return t.getRestApi();
            })
            .then(function (api) {
              return api.getToken();
            })
            .then(function (tok) {
              if (tok) {
                fetchAndOpenPreview(file, btn, tok);
              } else {
                alert('Could not get token. Please try again.');
              }
            })
            .catch(function (err) {
              btn.disabled = false;
              btn.textContent = 'Open preview';
              alert('Authorization failed: ' + (err.message || 'Please try again.'));
            });
        }
      })
      .catch(function () {
        // Fallback: use Rest API
        t.getRestApi()
          .then(function (api) {
            return api.isAuthorized();
          })
          .then(function (authorized) {
            if (authorized) {
              return t.getRestApi().then(function (api) { return api.getToken(); });
            } else {
              return t.getRestApi()
                .then(function (api) { return api.authorize({ scope: 'read' }); })
                .then(function () { return t.getRestApi(); })
                .then(function (api) { return api.getToken(); });
            }
          })
          .then(function (tok) {
            if (tok) fetchAndOpenPreview(file, btn, tok);
            else alert('Could not get token.');
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = 'Open preview';
            alert('Auth error: ' + (err.message || 'Please try again.'));
          });
      });
  }

  t.render(function () {
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (att) {
        return isExcel(att.name);
      });
      var container = document.getElementById('attachment-list');
      container.innerHTML = '';
      excelFiles.forEach(function (file) {
        var row = document.createElement('div');
        row.className = 'section-row';
        var icon = document.createElement('img');
        icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
        icon.className = 'section-icon';
        icon.alt = '';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = file.name;
        var btn = document.createElement('button');
        btn.className = 'section-preview-btn';
        btn.textContent = 'Open preview';
        btn.addEventListener('click', function () {
          getTokenAndPreview(file, btn);
        });
        row.appendChild(icon);
        row.appendChild(nameSpan);
        row.appendChild(btn);
        container.appendChild(row);
      });
      t.sizeTo('#attachment-list').catch(function () {});
    });
  });
})();
</script>
</body>
</html>
