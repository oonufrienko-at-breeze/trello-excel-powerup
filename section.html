<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">
<div id="attachment-list"></div>
<div id="auth-notice" class="auth-notice hidden">
  <p>⚠️ To preview Excel files, this Power-Up needs access to Trello.</p>
  <button id="authorize-btn" class="section-preview-btn">Authorize</button>
</div>
<script>
(function () {
  var t = TrelloPowerUp.iframe({
    appKey: 'eaa6d0d7c57218139af1b772bbd777cb',
    appName: 'Excel Preview'
  });
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  function fetchAndOpenPreview(file, btn, token) {
    var downloadUrl = file.url;
    downloadUrl = downloadUrl.replace('https://trello.com/1/', 'https://api.trello.com/1/');
    btn.disabled = true;
    btn.textContent = 'Loading...';
    fetch(downloadUrl, {
      credentials: 'omit',
      headers: {
        'Authorization': 'OAuth oauth_consumer_key="eaa6d0d7c57218139af1b772bbd777cb", oauth_token="' + token + '"'
      }
    })
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.arrayBuffer();
    })
    .then(function (buffer) {
      var key = 'excel_preview_' + file.id;
      localStorage.setItem(key, arrayBufferToBase64(buffer));
      t.modal({
        url: POWERUP_BASE_URL + '/viewer.html'
          + '?dataKey=' + encodeURIComponent(key)
          + '&name=' + encodeURIComponent(file.name),
        accentColor: '#217346',
        height: 800,
        title: file.name
      });
      btn.disabled = false;
      btn.textContent = 'Open preview';
    })
    .catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Open preview';
      console.error('[ExcelPreview]', err);
      alert('Could not load preview: ' + (err.message || 'Unknown error'));
    });
  }

  function openPreview(file, btn) {
    t.getRestApi()
      .then(function (api) {
        return api.isAuthorized().then(function (authorized) {
          if (!authorized) {
            return api.authorize({ scope: 'read' });
          }
          return api.getToken();
        });
      })
      .then(function (token) {
        if (token) {
          fetchAndOpenPreview(file, btn, token);
        } else {
          /* If authorize() was called but returned no token yet, try again */
          t.getRestApi()
            .then(function (api) { return api.getToken(); })
            .then(function (tok) {
              if (tok) fetchAndOpenPreview(file, btn, tok);
              else alert('Authorization failed. Please try again.');
            });
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Open preview';
        console.error('[ExcelPreview] auth error:', err);
        alert('Authorization error: ' + (err.message || 'Please try again.'));
      });
  }

  t.render(function () {
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (att) {
        return isExcel(att.name);
      });
      var container = document.getElementById('attachment-list');
      container.innerHTML = '';
      excelFiles.forEach(function (file) {
        var row = document.createElement('div');
        row.className = 'section-row';
        var icon = document.createElement('img');
        icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
        icon.className = 'section-icon';
        icon.alt = '';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = file.name;
        var btn = document.createElement('button');
        btn.className = 'section-preview-btn';
        btn.textContent = 'Open preview';
        btn.addEventListener('click', function () {
          openPreview(file, btn);
        });
        row.appendChild(icon);
        row.appendChild(nameSpan);
        row.appendChild(btn);
        container.appendChild(row);
      });
      t.sizeTo('#attachment-list').catch(function () {});
    });
  });
})();
</script>
</body>
</html>
