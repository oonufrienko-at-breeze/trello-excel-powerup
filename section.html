<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Excel Preview Section</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    /* Trello sets the data-color-mode attribute on <html> to either "light" or
       "dark". We define our own theme tokens against that attribute, so the
       text on the card back stays readable in both themes (the previous
       hard-coded #172b4d disappeared on the dark theme background). */
    html[data-color-mode="light"], html:not([data-color-mode]) {
      --xp-text: #172b4d;
      --xp-row-hover: #f4f5f7;
    }
    html[data-color-mode="dark"] {
      --xp-text: #b6c2cf;
      --xp-row-hover: rgba(255,255,255,0.06);
    }
    body {
      margin: 0; padding: 6px 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--xp-text);
      background: transparent;
    }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 6px; border-radius: 4px; cursor: default;
      transition: background 0.12s;
      color: var(--xp-text);
    }
    .row:hover { background: var(--xp-row-hover); }
    .icon { width: 20px; height: 20px; flex-shrink: 0; }
    .name {
      flex: 1; font-size: 13px;
      color: var(--xp-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Excel green is the brand color for the button — keep it the same in both themes
       so the green CTA stays recognizable. */
    .btn {
      background: #1D6F42; color: #fff; border: none; border-radius: 3px;
      padding: 4px 11px; font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0; transition: background 0.12s;
    }
    .btn:hover { background: #165a36; }
    .btn:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
  var BASE  = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';
  var PROXY = 'https://trello-excel-viewer.vercel.app';
  var VIEWER_VERSION = 'v20260428b';
  var EXCEL_EXTS = ['.xlsx', '.xls', '.xlsm', '.xlsb', '.csv'];
  var EXCEL_SVG  = '<svg viewBox="0 0 24 24" fill="#1D6F42" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6" fill="#a5d6a7"/></svg>';

  function isExcel(a) {
    var n = (a.name || a.url || '').toLowerCase();
    return EXCEL_EXTS.some(function(e) { return n.endsWith(e); });
  }

  function getToken(t) {
    try {
      return t.getRestApi().getToken().then(function(tk) {
        if (tk) return tk;
        return t.getRestApi().authorize({ scope: 'read' }).then(function() {
          return t.getRestApi().getToken();
        });
      }).catch(function() { return ''; });
    } catch(e) { return Promise.resolve(''); }
  }

  // Fetch appKey from server (kept out of committed client code for GitHub secret scanner)
  fetch(PROXY + '/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    var t = TrelloPowerUp.iframe({ appKey: cfg.appKey, appName: cfg.appName || 'Excel Preview' });
    initSection(t);
  }).catch(function() {
    // Fallback (still works without REST API — viewer can use fallback URL proxy)
    var t = TrelloPowerUp.iframe();
    initSection(t);
  });

  function initSection(t) {
  t.render(function() {
    Promise.all([
      t.card('id', 'attachments'),
    ]).then(function(results) {
      var card = results[0];
      var cardId = card.id;
      var files = (card.attachments || []).filter(isExcel);

      var root = document.getElementById('root');
      root.innerHTML = '';
      if (!files.length) return;

      files.forEach(function(f) {
        var row  = document.createElement('div'); row.className = 'row';
        var ico  = document.createElement('div'); ico.className = 'icon'; ico.innerHTML = EXCEL_SVG;
        var nm   = document.createElement('span'); nm.className = 'name'; nm.textContent = f.name;
        var btn  = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Excel Preview';

        btn.addEventListener('click', (function(file) {
          return function() {
            // Disable button while we wait for token; re-enable on error
            btn.disabled = true;
            var origText = btn.textContent;
            btn.textContent = 'Відкриваю...';

            // Hard timeout: if getToken/authorize hangs (popup blocked, user closed dialog),
            // re-enable the button after 8s so the user knows something went wrong.
            var hangTimer = setTimeout(function() {
              btn.disabled = false;
              btn.textContent = origText;
              alert('Не вдалося авторизуватись у Trello. Перевірте, що pop-up не заблокований, і спробуйте ще раз.');
            }, 8000);

            getToken(t).then(function(token) {
              clearTimeout(hangTimer);
              btn.disabled = false;
              btn.textContent = origText;
              t.modal({
                url: BASE + '/viewer.html?v=' + VIEWER_VERSION,
                args: {
                  url: file.url,
                  name: file.name,
                  id: file.id,
                  cardId: cardId,
                  token: token || '',
                  proxy: PROXY
                },
                fullscreen: true,
                title: '\uD83D\uDCCA ' + file.name,
                accentColor: '#1D6F42'
              });
            }).catch(function(err) {
              clearTimeout(hangTimer);
              btn.disabled = false;
              btn.textContent = origText;
              alert('Помилка авторизації: ' + (err && err.message ? err.message : 'невідома'));
            });
          };
        })(f));

        row.appendChild(ico); row.appendChild(nm); row.appendChild(btn);
        root.appendChild(row);
      });

      return t.sizeTo('#root');
    });
  });
  }
</script>
</body>
</html>
