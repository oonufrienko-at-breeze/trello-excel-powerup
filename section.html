<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">
<div id="attachment-list"></div>
<script>
(function () {
  var APP_KEY = 'eaa6d0d7c57218139af1b772bbd777cb';
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';
  var HARDCODED_TOKEN = 'ATTA9039c83a92e37752f96365207f630de0043d0118062a2e9f6588d95e6fe8ce8b52C04FF8';

  var params = new URLSearchParams(window.location.search);
  var AUTH_TOKEN = params.get('auth') || HARDCODED_TOKEN;
  var filesRaw = params.get('files') || '';

  var t = TrelloPowerUp.iframe({
    appKey: APP_KEY,
    appName: 'Excel Preview'
  });

  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    var chunkSize = 8192;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function doFetch(file, btn) {
    btn.textContent = 'Downloading...';
    btn.disabled = true;
    var url = file.url;
    url = url.replace('https://trello.com/1/', 'https://api.trello.com/1/');
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    var fetchUrl = url + sep + 'token=' + encodeURIComponent(AUTH_TOKEN) + '&key=' + APP_KEY;
    fetch(fetchUrl, { credentials: 'omit' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(function (buffer) {
        var key = 'excel_preview_' + file.id;
        localStorage.setItem(key, arrayBufferToBase64(buffer));
        btn.textContent = 'Open preview';
        btn.disabled = false;
        t.modal({
          url: POWERUP_BASE_URL + '/viewer.html'
            + '?dataKey=' + encodeURIComponent(key)
            + '&name=' + encodeURIComponent(file.name),
          accentColor: '#217346',
          height: 800,
          title: file.name
        });
      })
      .catch(function (err) {
        btn.textContent = 'Error: ' + err.message.slice(0, 20);
        btn.disabled = false;
        setTimeout(function () { btn.textContent = 'Open preview'; }, 4000);
      });
  }

  function renderFiles(excelFiles) {
    var container = document.getElementById('attachment-list');
    container.innerHTML = '';
    if (!excelFiles || !excelFiles.length) {
      container.textContent = 'No Excel files found';
      t.sizeTo('#attachment-list').catch(function () {});
      return;
    }
    excelFiles.forEach(function (file) {
      var row = document.createElement('div');
      row.className = 'section-row';
      var icon = document.createElement('img');
      icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
      icon.className = 'section-icon';
      icon.alt = '';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'section-name';
      nameSpan.textContent = file.name;
      var btn = document.createElement('button');
      btn.className = 'section-preview-btn';
      btn.textContent = 'Open preview';
      btn.addEventListener('click', function () { doFetch(file, btn); });
      row.appendChild(icon);
      row.appendChild(nameSpan);
      row.appendChild(btn);
      container.appendChild(row);
    });
    t.sizeTo('#attachment-list').catch(function () {});
  }

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  t.render(function () {
    /* Strategy 1: files passed in URL */
    if (filesRaw) {
      try {
        var files = JSON.parse(decodeURIComponent(filesRaw));
        if (files && files.length) {
          renderFiles(files);
          return;
        }
      } catch (e) { /* fall through */ }
    }

    /* Strategy 2: t.card('attachments') */
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (a) { return isExcel(a.name); });
      if (excelFiles.length) {
        renderFiles(excelFiles);
        return;
      }
      /* Strategy 3: REST API */
      t.card('id').then(function (c) {
        var url = 'https://api.trello.com/1/cards/' + c.id +
          '/attachments?key=' + APP_KEY + '&token=' + encodeURIComponent(AUTH_TOKEN);
        return fetch(url).then(function (r) { return r.json(); });
      }).then(function (atts) {
        renderFiles((Array.isArray(atts) ? atts : []).filter(function (a) { return isExcel(a.name); }));
      }).catch(function (e) {
        document.getElementById('attachment-list').textContent = 'API err: ' + e.message;
        t.sizeTo('#attachment-list').catch(function () {});
      });
    }).catch(function (e) {
      /* Strategy 3: REST API when t.card fails */
      t.card('id').then(function (c) {
        var url = 'https://api.trello.com/1/cards/' + c.id +
          '/attachments?key=' + APP_KEY + '&token=' + encodeURIComponent(AUTH_TOKEN);
        return fetch(url).then(function (r) { return r.json(); });
      }).then(function (atts) {
        renderFiles((Array.isArray(atts) ? atts : []).filter(function (a) { return isExcel(a.name); }));
      }).catch(function (e2) {
        document.getElementById('attachment-list').textContent = 'Err: ' + e.message + ' / ' + e2.message;
        t.sizeTo('#attachment-list').catch(function () {});
      });
    });
  });
})();
</script>
</body>
</html>
