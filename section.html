<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">

<div id="attachment-list"></div>

<script>
(function () {
  var t = TrelloPowerUp.iframe();
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  /* ── base64 helper ── */
  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    var chunkSize = 8192;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function openPreview(file) {
    /* Immediately show a "Loading" popup as visual feedback */
    t.popup({
      title: 'Loading…',
      url: POWERUP_BASE_URL + '/loading.html',
      height: 80
    });

    t.getRestApi()
      .then(function (api) { return api.getToken(); })
      .then(function (token) {
        var urlWithToken = file.url +
          (file.url.indexOf('?') === -1 ? '?' : '&') +
          'token=' + encodeURIComponent(token);

        return fetch(urlWithToken, { credentials: 'omit' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.arrayBuffer();
          });
      })
      .then(function (buffer) {
        var base64 = arrayBufferToBase64(buffer);
        return t.set('card', 'private', 'previewData', {
          base64: base64,
          name: file.name,
          ts: Date.now()
        });
      })
      .then(function () {
        t.closePopup();
        return t.modal({
          url: POWERUP_BASE_URL + '/viewer.html?name=' + encodeURIComponent(file.name),
          accentColor: '#217346',
          height: 800,
          title: file.name
        });
      })
      .catch(function (err) {
        t.closePopup();
        t.popup({
          title: 'Error',
          url: POWERUP_BASE_URL + '/error.html?msg=' + encodeURIComponent(err.message || 'Could not load file'),
          height: 120
        });
      });
  }

  t.render(function () {
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (att) {
        return isExcel(att.name);
      });

      var container = document.getElementById('attachment-list');
      container.innerHTML = '';

      excelFiles.forEach(function (file) {
        var row = document.createElement('div');
        row.className = 'section-row';

        var icon = document.createElement('img');
        icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
        icon.className = 'section-icon';
        icon.alt = '';

        var nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = file.name;

        var btn = document.createElement('button');
        btn.className = 'section-preview-btn';
        btn.textContent = 'Open preview';
        btn.addEventListener('click', function () { openPreview(file); });

        row.appendChild(icon);
        row.appendChild(nameSpan);
        row.appendChild(btn);
        container.appendChild(row);
      });

      t.sizeTo('#attachment-list').catch(function () {});
    });
  });
})();
</script>
</body>
</html>
