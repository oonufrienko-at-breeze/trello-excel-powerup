<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Excel Preview Section</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    /* Trello sets the data-color-mode attribute on <html> to either "light" or
       "dark". We define our own theme tokens against that attribute, so the
       text on the card back stays readable in both themes (the previous
       hard-coded #172b4d disappeared on the dark theme background). */
    html[data-color-mode="light"], html:not([data-color-mode]) {
      --xp-text: #172b4d;
      --xp-row-hover: #f4f5f7;
    }
    html[data-color-mode="dark"] {
      --xp-text: #b6c2cf;
      --xp-row-hover: rgba(255,255,255,0.06);
    }
    body {
      margin: 0; padding: 6px 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--xp-text);
      background: transparent;
    }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 6px; border-radius: 4px; cursor: default;
      transition: background 0.12s;
      color: var(--xp-text);
    }
    .row:hover { background: var(--xp-row-hover); }
    .icon { width: 20px; height: 20px; flex-shrink: 0; }
    .name {
      flex: 1; font-size: 13px;
      color: var(--xp-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Excel green is the brand color for the button — keep it the same in both themes
       so the green CTA stays recognizable. */
    .btn {
      background: #1D6F42; color: #fff; border: none; border-radius: 3px;
      padding: 4px 11px; font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0; transition: background 0.12s;
    }
    .btn:hover { background: #165a36; }
    .btn:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
  var BASE  = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';
  var PROXY = 'https://trello-excel-viewer.vercel.app';
  var VIEWER_VERSION = 'v20260428m';
  var EXCEL_EXTS = ['.xlsx', '.xls', '.xlsm', '.xlsb', '.csv'];
  var EXCEL_SVG  = '<svg viewBox="0 0 24 24" fill="#1D6F42" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6" fill="#a5d6a7"/></svg>';

  function isExcel(a) {
    var n = (a.name || a.url || '').toLowerCase();
    return EXCEL_EXTS.some(function(e) { return n.endsWith(e); });
  }

  // CRITICAL: TrelloPowerUp.iframe() must be called SYNCHRONOUSLY at script load,
  // otherwise Trello's iframe handshake can race ahead and t.card() / t.render()
  // start returning empty/null. Earlier we awaited /api/config first, which broke
  // the section: the file row sometimes never rendered.
  //
  // We initialize without appKey here. appKey is only needed for getRestApi(),
  // which we only use when the user clicks the button — we can fetch the key
  // lazily then.
  var t = TrelloPowerUp.iframe({ appName: 'Excel Preview' });
  window.__t = t; // експонуємо для message-лістенерів, які обявляються пізніше

  // Lazily fetched appKey. We also store it synchronously so click handlers can
  // use it WITHOUT awaiting (await breaks user gesture, popup gets blocked).
  var appKeySync = '';
  var appKeyPromise = fetch(PROXY + '/api/config')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(cfg) {
      var key = cfg && cfg.appKey ? cfg.appKey : '';
      if (key) {
        appKeySync = key;
        // Переініціалізуємо iframe з appKey відразу як тільки отримали —
        // щоб getRestApi() працював синхронно в клік-хендлері (без await).
        try { TrelloPowerUp.iframe({ appKey: key, appName: 'Excel Preview' }); } catch(_) {}
      }
      return key;
    })
    .catch(function() { return ''; });

  // Returns a token, asking the user to authorize if needed. Needs the appKey to
  // be present — if /api/config failed, getRestApi() may still work if Trello
  // has cached it from elsewhere; otherwise we resolve to empty token and let the
  // viewer fall back to its URL proxy.
  // Ключ у localStorage для токена отриманого через auth-callback.html
  var TOKEN_LS_KEY = 'trelloExcelPreview_userToken';
  var TOKEN_REGEX  = /^[A-Za-z0-9_\-]{40,}$/;

  // Trello Power-Up storage — працює всередині Trello iframe незалежно
  // від Chrome storage partitioning — бо дані живуть на боці Trello.
  function savePuToken(t, token) {
    try {
      return t.set('member', 'private', 'excelPreviewToken', token);
    } catch(_) { return Promise.resolve(); }
  }
  function loadPuToken(t) {
    try {
      return t.get('member', 'private', 'excelPreviewToken').catch(function(){ return ''; });
    } catch(_) { return Promise.resolve(''); }
  }

  // Слухаємо postMessage від auth-callback.html (відкривається в новій вкладці
  // з target=_blank, але якщо оригінальний click був в section iframe — ми є opener'ом).
  var lastReceivedToken = '';
  window.addEventListener('message', function(ev) {
    var d = ev.data;
    if (d && d.type === 'trelloExcelPreview:token' && d.token && TOKEN_REGEX.test(d.token)) {
      lastReceivedToken = d.token;
      try { localStorage.setItem(TOKEN_LS_KEY, d.token); } catch(_) {}
      // Асинхронно зберігаємо у PU storage — вони живуть на стороні Trello,
      // тож будуть доступні при наступному відкритті картки.
      try { savePuToken(window.__t || null, d.token); } catch(_) {}
    }
  });

  // BroadcastChannel — резервний канал (якщо postMessage не працює через noopener)
  try {
    var bc = new BroadcastChannel('trelloExcelPreview');
    bc.addEventListener('message', function(ev) {
      var d = ev.data;
      if (d && d.type === 'token' && d.token && TOKEN_REGEX.test(d.token)) {
        lastReceivedToken = d.token;
        try { localStorage.setItem(TOKEN_LS_KEY, d.token); } catch(_) {}
        try { savePuToken(window.__t || null, d.token); } catch(_) {}
      }
    });
  } catch(_) {}

  function getToken(t) {
    // 0) Токен, що тільки що прийшов через postMessage/BroadcastChannel
    if (lastReceivedToken && TOKEN_REGEX.test(lastReceivedToken)) {
      return Promise.resolve(lastReceivedToken);
    }

    // 1) localStorage (може не працювати через Chrome storage partitioning)
    try {
      var lsToken = localStorage.getItem(TOKEN_LS_KEY);
      if (lsToken && TOKEN_REGEX.test(lsToken)) {
        return Promise.resolve(lsToken);
      }
    } catch(_) {}

    // 2) Trello Power-Up storage (обходить partitioning — живе на сервері Trello)
    return loadPuToken(t).then(function(puToken) {
      if (puToken && TOKEN_REGEX.test(puToken)) {
        return puToken;
      }

      // 3) Остання спроба — Trello SDK (старий шлях)
      return appKeyPromise.then(function(appKey) {
        if (appKey) {
          try { TrelloPowerUp.iframe({ appKey: appKey, appName: 'Excel Preview' }); } catch(e) {}
        }
        try {
          return t.getRestApi().getToken().then(function(tk) {
            if (tk) return tk;
            return t.getRestApi().authorize({ scope: 'read' }).then(function() {
              return t.getRestApi().getToken();
            });
          }).catch(function() { return ''; });
        } catch(e) { return ''; }
      });
    });
  }

  initSection(t);

  function initSection(t) {
  t.render(function() {
    Promise.all([
      t.card('id', 'attachments'),
    ]).then(function(results) {
      var card = results[0];
      var cardId = card.id;
      var files = (card.attachments || []).filter(isExcel);

      var root = document.getElementById('root');
      root.innerHTML = '';
      if (!files.length) return;

      files.forEach(function(f) {
        var row  = document.createElement('div'); row.className = 'row';
        var ico  = document.createElement('div'); ico.className = 'icon'; ico.innerHTML = EXCEL_SVG;
        var nm   = document.createElement('span'); nm.className = 'name'; nm.textContent = f.name;
        var btn  = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Excel Preview';

        btn.addEventListener('click', (function(file) {
          return function() {
            // Disable button while we wait for token; re-enable on error
            btn.disabled = true;
            var origText = btn.textContent;
            btn.textContent = 'Відкриваю...';

            // Hard timeout: if getToken/authorize hangs (popup blocked, user closed dialog),
            // re-enable the button after 8s so the user knows something went wrong.
            var hangTimer = setTimeout(function() {
              btn.disabled = false;
              btn.textContent = origText;
              alert('Не вдалося авторизуватись у Trello. Перевірте, що pop-up не заблокований, і спробуйте ще раз.');
            }, 8000);

            getToken(t).then(function(token) {
              clearTimeout(hangTimer);
              btn.disabled = false;
              btn.textContent = origText;
              t.modal({
                url: BASE + '/viewer.html?v=' + VIEWER_VERSION,
                args: {
                  url: file.url,
                  name: file.name,
                  id: file.id,
                  cardId: cardId,
                  token: token || '',
                  proxy: PROXY
                },
                fullscreen: true,
                title: '\uD83D\uDCCA ' + file.name,
                accentColor: '#1D6F42'
              });
            }).catch(function(err) {
              clearTimeout(hangTimer);
              btn.disabled = false;
              btn.textContent = origText;
              alert('Помилка авторизації: ' + (err && err.message ? err.message : 'невідома'));
            });
          };
        })(f));

        row.appendChild(ico); row.appendChild(nm); row.appendChild(btn);
        root.appendChild(row);
      });

      // Кнопка примусової переавторизації (для випадку 401 missing scopes —
      // коли старий кешований токен не має доступу read).
      var reauthRow = document.createElement('div');
      reauthRow.style.cssText = 'margin-top:8px; font-size:12px; opacity:0.75;';
      var reauthLink = document.createElement('a');
      reauthLink.href = '#';
      reauthLink.textContent = 'Не відкривається? Переавторизувати доступ Trello (відкриється нова вкладка)';
      reauthLink.style.cssText = 'color:#0079bf; text-decoration:underline; cursor:pointer;';
      // ВАЖЛИВО: використовуємо атрибут href замість JS-навігації — click на звичайному
      // посиланні з target=_blank НІКОЛИ не блокується popup-блокером.
      // Обходимо бажний Trello SDK зовсім — прямо навігуємо на trello.com/1/authorize.
      function buildAuthUrl(appKey) {
        var returnUrl = BASE + '/auth-callback.html';
        return 'https://trello.com/1/authorize' +
          '?expiration=never' +
          '&scope=read' +
          '&response_type=token' +
          '&name=' + encodeURIComponent('Excel Preview') +
          '&key=' + encodeURIComponent(appKey) +
          '&return_url=' + encodeURIComponent(returnUrl) +
          '&callback_method=fragment';
      }

      // Синхронно виставляємо href як тільки отримаємо appKey.
      function updateReauthHref() {
        if (appKeySync) {
          reauthLink.href = buildAuthUrl(appKeySync);
          reauthLink.target = '_blank';
          // ВАЖЛИВО: НЕ виставляємо noopener — потрібен window.opener,
          // щоб auth-callback міг повернути токен через postMessage.
        }
      }
      updateReauthHref();
      appKeyPromise.then(updateReauthHref);

      reauthLink.addEventListener('click', function(e) {
        // Якщо appKey ще не завантажений — блокуємо перехід і повідомляємо.
        if (!reauthLink.href || reauthLink.href.indexOf('trello.com/1/authorize') === -1) {
          e.preventDefault();
          alert('Калібрування ще триває. Почекайте 1–2 секунди і спробуйте знову. ' +
                'Якщо не допомагає — перевірте доступність ' + PROXY + '/api/config');
          return;
        }
        // Інакше — лишаємо default behavior (target=_blank на звичайному посиланні = нова вкладка).
      });
      reauthRow.appendChild(reauthLink);
      root.appendChild(reauthRow);

      return t.sizeTo('#root');
    });
  });
  }
</script>
</body>
</html>
