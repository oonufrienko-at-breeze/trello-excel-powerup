<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">
<div id="attachment-list"></div>
<script>
(function () {
  var t = TrelloPowerUp.iframe({
    appKey: 'eaa6d0d7c57218139af1b772bbd777cb',
    appName: 'Excel Preview'
  });
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  /* Open viewer modal - pass file URL and ID as params.
     The viewer.html (a Trello modal, not an attachment-section iframe)
     can call t.getRestApi() successfully because modals are not
     subject to the same popup-blocker restriction as section iframes. */
  function openPreview(file, btn) {
    btn.textContent = 'Loading\u2026';
    btn.disabled = true;

    t.modal({
      url: POWERUP_BASE_URL + '/viewer.html'
        + '?fileUrl=' + encodeURIComponent(file.url)
        + '&fileId=' + encodeURIComponent(file.id || '')
        + '&name=' + encodeURIComponent(file.name),
      accentColor: '#217346',
      height: 800,
      title: file.name
    }).catch(function (err) {
      console.error('[ExcelPreview] modal error:', err);
    }).then(function () {
      btn.textContent = 'Open preview';
      btn.disabled = false;
    });
  }

  t.render(function () {
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (att) {
        return isExcel(att.name);
      });
      var container = document.getElementById('attachment-list');
      container.innerHTML = '';
      excelFiles.forEach(function (file) {
        var row = document.createElement('div');
        row.className = 'section-row';
        var icon = document.createElement('img');
        icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
        icon.className = 'section-icon';
        icon.alt = '';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = file.name;
        var btn = document.createElement('button');
        btn.className = 'section-preview-btn';
        btn.textContent = 'Open preview';
        btn.addEventListener('click', function () {
          openPreview(file, btn);
        });
        row.appendChild(icon);
        row.appendChild(nameSpan);
        row.appendChild(btn);
        container.appendChild(row);
      });
      t.sizeTo('#attachment-list').catch(function () {});
    });
  });
})();
</script>
</body>
</html>
