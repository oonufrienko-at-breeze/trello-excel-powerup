<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Attachments</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="section-body">
<div id="attachment-list"></div>
<script>
(function () {
  var t = TrelloPowerUp.iframe({
    appKey: 'eaa6d0d7c57218139af1b772bbd777cb',
    appName: 'Excel Preview'
  });
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  function isExcel(name) {
    return /\.(xlsx|xls|xlsm)$/i.test(name || '');
  }

  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  function openPreview(file, btn) {
    btn.disabled = true;
    btn.textContent = 'Loading...';

    t.getRestApi()
      .then(function (api) { return api.getToken(); })
      .then(function (token) {
        /* Trello attachment download requires OAuth Authorization header.
           The download endpoint is the Trello API URL (not trello.com/1/...) */
        var downloadUrl = file.url;
        /* Replace trello.com/1/ with api.trello.com/1/ if needed */
        downloadUrl = downloadUrl.replace('https://trello.com/1/', 'https://api.trello.com/1/');
        return fetch(downloadUrl, {
          credentials: 'omit',
          headers: {
            'Authorization': 'OAuth oauth_consumer_key="eaa6d0d7c57218139af1b772bbd777cb", oauth_token="' + token + '"'
          }
        });
      })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.arrayBuffer();
      })
      .then(function (buffer) {
        /* Store base64 data in sessionStorage so viewer.html can read it */
        var key = 'excel_preview_' + file.id;
        var b64 = arrayBufferToBase64(buffer);
        sessionStorage.setItem(key, b64);
        sessionStorage.setItem('excel_preview_name', file.name);
        t.modal({
          url: POWERUP_BASE_URL + '/viewer.html'
            + '?dataKey=' + encodeURIComponent(key)
            + '&name=' + encodeURIComponent(file.name),
          accentColor: '#217346',
          height: 800,
          title: file.name
        });
        btn.disabled = false;
        btn.textContent = 'Open preview';
      })
      .catch(function (err) {
        console.error('[ExcelPreview] Error:', err);
        btn.disabled = false;
        btn.textContent = 'Open preview';
        alert('Could not load preview: ' + (err.message || 'Unknown error'));
      });
  }

  t.render(function () {
    t.card('attachments').then(function (card) {
      var excelFiles = (card.attachments || []).filter(function (att) {
        return isExcel(att.name);
      });
      var container = document.getElementById('attachment-list');
      container.innerHTML = '';
      excelFiles.forEach(function (file) {
        var row = document.createElement('div');
        row.className = 'section-row';
        var icon = document.createElement('img');
        icon.src = POWERUP_BASE_URL + '/icons/icon.svg';
        icon.className = 'section-icon';
        icon.alt = '';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = file.name;
        var btn = document.createElement('button');
        btn.className = 'section-preview-btn';
        btn.textContent = 'Open preview';
        btn.addEventListener('click', function () {
          openPreview(file, btn);
        });
        row.appendChild(icon);
        row.appendChild(nameSpan);
        row.appendChild(btn);
        container.appendChild(row);
      });
      t.sizeTo('#attachment-list').catch(function () {});
    });
  });
})();
</script>
</body>
</html>
