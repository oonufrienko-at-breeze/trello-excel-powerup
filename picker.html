<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Excel file</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="picker-body">

<ul id="file-list" class="file-list"></ul>

<script>
(function () {
    var t = TrelloPowerUp.iframe({ appKey: 'eaa6d0d7c57218139af1b772bbd777cb', appName: 'Excel Preview' });
  var POWERUP_BASE_URL = 'https://oonufrienko-at-breeze.github.io/trello-excel-powerup';

  /* ── base64 helper (same as client.js) ── */
  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    var chunkSize = 8192;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function openPreview(file) {
    t.closePopup();

    
t.getRestApi()
      .then(function (api) { return api.getToken(); })
      .then(function (token) {
        var urlWithToken = file.url +
          (file.url.indexOf('?') === -1 ? '?' : '&') +
          'token=' + encodeURIComponent(token);

        return fetch(urlWithToken, { credentials: 'omit' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.arrayBuffer();
          });
      })
      .then(function (buffer) {
        var base64 = arrayBufferToBase64(buffer);
        return t.set('card', 'private', 'previewData', {
          base64: base64,
          name: file.name,
          ts: Date.now()
        });
      })
      .then(function () {
        t.closePopup();
        return t.modal({
          url: POWERUP_BASE_URL + '/viewer.html?name=' + encodeURIComponent(file.name),
          accentColor: '#217346',
          height: 800,
          title: file.name
        });
      })
      .catch(function (err) {
        t.closePopup();
        t.popup({
          title: 'Error',
          url: POWERUP_BASE_URL + '/error.html?msg=' + encodeURIComponent(err.message || 'Could not load file'),
          height: 120
        });
      });
  }

  t.render(function () {
    var args = t.arg('files') || [];
    var list = document.getElementById('file-list');
    list.innerHTML = '';

    args.forEach(function (file) {
      var li = document.createElement('li');
      li.className = 'file-item';

      var btn = document.createElement('button');
      btn.className = 'file-btn';
      btn.textContent = file.name;
      btn.addEventListener('click', function () { openPreview(file); });

      li.appendChild(btn);
      list.appendChild(li);
    });

    t.sizeTo('#file-list').catch(function () {});
  });
})();
</script>
</body>
</html>
