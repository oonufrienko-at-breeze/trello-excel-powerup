<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Excel Preview</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f5f7; }

    .app { display: flex; flex-direction: column; height: 100%; }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 9px 14px; background: #fff; border-bottom: 1px solid #dfe1e6; min-height: 46px;
    }
    .file-info { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
    .file-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .file-name { font-size: 14px; font-weight: 600; color: #172b4d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { font-size: 12px; color: #6b778c; flex-shrink: 0; }

    /* Sheet tabs */
    .sheet-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
    .tab {
      padding: 4px 13px; background: #f0f1f4; border: 1px solid #dfe1e6;
      border-radius: 3px; font-size: 12px; color: #5e6c84; cursor: pointer;
      transition: all 0.12s; white-space: nowrap;
    }
    .tab:hover { background: #e4e6ea; }
    .tab.active { background: #1D6F42; color: #fff; border-color: #1D6F42; }

    /* Table */
    .table-wrap { flex: 1; overflow: auto; padding: 12px; }
    #sheet-output table {
      border-collapse: collapse; background: #fff; min-width: 100%;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 13px;
    }
    #sheet-output tr:first-child td,
    #sheet-output th {
      background: #1D6F42; color: #fff; font-weight: 600;
      padding: 8px 12px; white-space: nowrap; position: sticky; top: 0; z-index: 2;
    }
    #sheet-output td { padding: 6px 12px; color: #172b4d; border-bottom: 1px solid #f0f1f4; white-space: nowrap; max-width: 500px; overflow: hidden; text-overflow: ellipsis; }
    #sheet-output tr:nth-child(even) td { background: #fafbfc; }
    #sheet-output tr:hover td { background: #e8f5e9; }
    #sheet-output tr:first-child:hover td { background: #1D6F42; color: #fff; }

    /* States */
    .state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; padding: 24px; }
    .spinner { width: 38px; height: 38px; border: 4px solid #dfe1e6; border-top-color: #1D6F42; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { font-size: 14px; color: #5e6c84; text-align: center; }
    .err-icon { font-size: 44px; }
    .err-msg { font-size: 14px; color: #de350b; text-align: center; max-width: 500px; }
    .err-hint { font-size: 12px; color: #6b778c; text-align: center; max-width: 500px; }
    .btn { padding: 7px 16px; background: #1D6F42; color: #fff; border: none; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #165a36; }
  </style>
</head>
<body>
<div class="app">
  <!-- Loading -->
  <div id="s-loading" class="state">
    <div class="spinner"></div>
    <div class="state-text" id="loading-msg">Завантаження файлу...</div>
    <pre id="debug-log" style="font-size:10px;color:#6b778c;background:#f4f5f7;padding:8px;border-radius:4px;max-width:90%;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:16px;text-align:left;"></pre>
  </div>

  <!-- Error -->
  <div id="s-error" class="state" style="display:none">
    <div class="err-icon">⚠️</div>
    <div class="err-msg" id="err-msg"></div>
    <div class="err-hint" id="err-hint"></div>
    <button class="btn" onclick="loadFile()">Спробувати знову</button>
  </div>

  <!-- Content -->
  <div id="s-content" style="display:none; flex:1; min-height:0; flex-direction:column;">
    <div class="toolbar">
      <div class="file-info">
        <svg class="file-icon" viewBox="0 0 24 24" fill="#1D6F42">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
          <path d="M14 2v6h6" fill="#a5d6a7"/>
        </svg>
        <span class="file-name" id="fname"></span>
        <span class="file-size" id="fsize"></span>
      </div>
      <div class="sheet-tabs" id="tabs"></div>
    </div>
    <div class="table-wrap">
      <div id="sheet-output"></div>
    </div>
  </div>
</div>

<script>
(function() {
  var t = TrelloPowerUp.iframe({ appKey: 'eaa6d0d7c57218139af1b772bbd777cb', appName: 'Excel Preview' });
  var wb = null;

  function dbg(msg) {
    var el = document.getElementById('debug-log');
    if (el) el.textContent += '[' + new Date().toISOString().slice(11,23) + '] ' + msg + '\n';
    try { console.log('[ExcelPreview]', msg); } catch(e) {}
  }

  function show(id) {
    ['s-loading','s-error','s-content'].forEach(function(s) {
      var el = document.getElementById(s);
      el.style.display = (s === id) ? 'flex' : 'none';
    });
  }

  function setLoading(msg) {
    show('s-loading');
    document.getElementById('loading-msg').textContent = msg || 'Завантаження...';
  }

  function setError(msg, hint) {
    show('s-error');
    document.getElementById('err-msg').textContent = msg || 'Помилка';
    document.getElementById('err-hint').textContent = hint || '';
  }

  function fmtBytes(b) {
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  function renderSheet(name) {
    var ws = wb.Sheets[name];
    document.getElementById('sheet-output').innerHTML = XLSX.utils.sheet_to_html(ws, { editable: false });
    document.querySelectorAll('#tabs .tab').forEach(function(tab) {
      tab.classList.toggle('active', tab.dataset.sheet === name);
    });
  }

  function buildTabs() {
    var container = document.getElementById('tabs');
    container.innerHTML = '';
    wb.SheetNames.forEach(function(n) {
      var tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.sheet = n;
      tab.textContent = n;
      tab.addEventListener('click', function() { renderSheet(n); });
      container.appendChild(tab);
    });
  }

  // ── Fetch file via server-side attachment endpoint ──
  // Server calls Trello API and returns binary in single request —
  // avoids CORS issues and URL corruption.
  function fetchAttachment(cardId, attachmentId, token, proxy) {
    return new Promise(function(resolve, reject) {
      var url = proxy + '/api/attachment' +
                '?cardId=' + encodeURIComponent(cardId) +
                '&attachmentId=' + encodeURIComponent(attachmentId) +
                (token ? '&token=' + encodeURIComponent(token) : '');

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.timeout = 45000;

      xhr.onload = function() {
        if (xhr.status === 200) {
          resolve(xhr.response);
          return;
        }
        // Try to decode error JSON from arraybuffer
        var errMsg = 'HTTP ' + xhr.status;
        try {
          var decoder = new TextDecoder('utf-8');
          var body = decoder.decode(new Uint8Array(xhr.response));
          var parsed = JSON.parse(body);
          if (parsed.error) errMsg = parsed.error;
          if (parsed.details) errMsg += ' (' + parsed.details + ')';
        } catch(e) { /* keep HTTP status */ }
        reject(new Error(errMsg));
      };
      xhr.onerror   = function() { reject(new Error('Мережева помилка')); };
      xhr.ontimeout = function() { reject(new Error('Timeout 45с')); };
      xhr.send();
    });
  }

  // ── Legacy fallback: fetch via generic URL proxy (used if no attachmentId) ──
  function fetchViaUrlProxy(attUrl, token, proxy) {
    return new Promise(function(resolve, reject) {
      var url = proxy + '/api/proxy?url=' + encodeURIComponent(attUrl);
      if (token) url += '&token=' + encodeURIComponent(token);

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.timeout = 45000;

      xhr.onload = function() {
        if (xhr.status === 200) { resolve(xhr.response); return; }
        var errMsg = 'HTTP ' + xhr.status;
        try {
          var decoder = new TextDecoder('utf-8');
          var body = decoder.decode(new Uint8Array(xhr.response));
          var parsed = JSON.parse(body);
          if (parsed.error) errMsg = parsed.error;
        } catch(e) {}
        reject(new Error(errMsg));
      };
      xhr.onerror   = function() { reject(new Error('Мережева помилка')); };
      xhr.ontimeout = function() { reject(new Error('Timeout 45с')); };
      xhr.send();
    });
  }

  function loadFile() {
    document.getElementById('debug-log').textContent = '';
    dbg('loadFile() called. BUILD=2026-04-23-v2');

    var attUrl  = t.arg('url');
    var attName = t.arg('name') || 'Excel файл';
    var attId   = t.arg('id') || '';
    var cardId  = t.arg('cardId') || '';
    var token   = t.arg('token') || '';
    var proxy   = t.arg('proxy') || 'https://trello-excel-viewer.vercel.app';

    dbg('args: name=' + attName);
    dbg('      attId=' + attId + ' (' + attId.length + ' chars)');
    dbg('      cardId=' + cardId + ' (' + cardId.length + ' chars)');
    dbg('      token=' + (token ? token.slice(0,8) + '... (' + token.length + ')' : '<empty>'));
    dbg('      url=' + (attUrl ? attUrl.slice(0, 80) + '...' : '<empty>'));

    document.getElementById('fname').textContent = attName;
    setLoading('Завантаження ' + attName + '...');

    // Prefer new attachment endpoint (server-side Trello API call)
    var fetchPromise;
    if (cardId && attId) {
      dbg('→ using /api/attachment endpoint');
      fetchPromise = fetchAttachment(cardId, attId, token, proxy);
    } else if (attUrl) {
      dbg('→ fallback: /api/proxy (legacy URL proxy)');
      fetchPromise = fetchViaUrlProxy(attUrl, token, proxy);
    } else {
      dbg('✗ no cardId/attId/url available');
      setError('Не вистачає даних про файл.', 'Закрийте та відкрийте preview знову.');
      return;
    }

    fetchPromise.then(function(buffer) {
      dbg('✓ fetched ' + buffer.byteLength + ' bytes');
      try {
        setLoading('Читаємо файл...');
        var data = new Uint8Array(buffer);
        document.getElementById('fsize').textContent = fmtBytes(data.byteLength);
        wb = XLSX.read(data, { type: 'array' });
        if (!wb.SheetNames || !wb.SheetNames.length) {
          setError('Файл не містить аркушів.', 'Можливо, файл пошкоджений.');
          return;
        }
        dbg('✓ parsed, ' + wb.SheetNames.length + ' sheet(s): ' + wb.SheetNames.join(', '));
        buildTabs();
        renderSheet(wb.SheetNames[0]);
        show('s-content');
      } catch(e) {
        dbg('✗ parse error: ' + e.message);
        setError('Не вдалося прочитати файл.', e.message);
      }
    }).catch(function(err) {
      var msg = (err && err.message) ? err.message : 'Unknown';
      dbg('✗ fetch failed: ' + msg);
      setError('Помилка завантаження', msg);
    });
  }

  // Extra safety net — if still stuck in loading state after 50s, show timeout error
  setTimeout(function() {
    var loading = document.getElementById('s-loading');
    if (loading && loading.style.display !== 'none') {
      dbg('✗ safety timeout after 50s — something hung silently');
      setError('Таймаут (50с)', 'Запит не завершився. Перевірте консоль.');
    }
  }, 50000);

  loadFile();
})();
</script>
</body>
</html>
