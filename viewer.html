<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Preview</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- SheetJS (xlsx) — full build from CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- Trello Power-Up SDK -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="viewer-body">

  <!-- ── Top bar ── -->
  <header class="viewer-header">
    <span id="file-name-label" class="file-name">Loading…</span>
    <div class="header-right">
      <div id="sheet-tabs" class="sheet-tabs"></div>
      <button id="close-btn" class="close-btn" title="Close">✕</button>
    </div>
  </header>

  <!-- ── Main content ── -->
  <main class="viewer-main">
    <div id="loading-state" class="state-box">
      <div class="spinner"></div>
      <p>Rendering spreadsheet…</p>
    </div>

    <div id="error-state" class="state-box hidden">
      <p class="error-icon">⚠️</p>
      <p id="error-message">Could not load file.</p>
      <button id="retry-btn" class="retry-btn">Try again</button>
    </div>

    <div id="table-wrapper" class="table-wrapper hidden">
      <div id="table-container" class="table-container"></div>
    </div>
  </main>

<script>
/* =============================================================
   viewer.html — inline script

   FIX: No longer does a direct fetch() of the Trello attachment URL.
   Instead, reads pre-fetched base64 file data from Trello Power-Up
   card storage (t.get 'card','private','previewData'), which was
   stored by client.js using an authorized token — no CORS issues.
   ============================================================= */
(function () {
  'use strict';

  /* ── Trello iframe init ── */
  var t = TrelloPowerUp.iframe();

  /* ── DOM refs ── */
  var fileNameLabel  = document.getElementById('file-name-label');
  var sheetTabsEl    = document.getElementById('sheet-tabs');
  var loadingState   = document.getElementById('loading-state');
  var errorState     = document.getElementById('error-state');
  var errorMessage   = document.getElementById('error-message');
  var retryBtn       = document.getElementById('retry-btn');
  var tableWrapper   = document.getElementById('table-wrapper');
  var tableContainer = document.getElementById('table-container');
  var closeBtn       = document.getElementById('close-btn');

  /* ── File name from URL param (for title only) ── */
  var params   = new URLSearchParams(window.location.search);
  var fileName = params.get('name') || 'Excel file';

  fileNameLabel.textContent = fileName;
  document.title = fileName;

  /* ── Workbook state ── */
  var workbook = null;

  /* ── UI helpers ── */
  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  function showLoading() {
    show(loadingState);
    hide(errorState);
    hide(tableWrapper);
  }

  function showError(msg) {
    hide(loadingState);
    errorMessage.textContent = msg;
    show(errorState);
    hide(tableWrapper);
  }

  function showTable() {
    hide(loadingState);
    hide(errorState);
    show(tableWrapper);
  }

  /* ── Convert base64 string → Uint8Array ── */
  function base64ToUint8Array(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  /* ── Render a specific sheet ── */
  function renderSheet(sheetName) {
    var ws = workbook.Sheets[sheetName];
    if (!ws) return;

    var html = XLSX.utils.sheet_to_html(ws, {
      id: 'excel-table',
      editable: false
    });

    tableContainer.innerHTML = html;

    var table = tableContainer.querySelector('table');
    if (table) table.className = 'excel-table';

    showTable();

    /* Update active tab highlight */
    sheetTabsEl.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.sheet === sheetName);
    });
  }

  /* ── Build sheet tabs ── */
  function buildTabs(sheetNames) {
    sheetTabsEl.innerHTML = '';
    sheetNames.forEach(function (name, idx) {
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
      btn.dataset.sheet = name;
      btn.textContent = name;
      btn.addEventListener('click', function () { renderSheet(name); });
      sheetTabsEl.appendChild(btn);
    });
  }

  /* ── Main load function ── */
  function loadFromStorage() {
    showLoading();
    workbook = null;
    sheetTabsEl.innerHTML = '';
    tableContainer.innerHTML = '';

    /*
      Read base64 file data stored by client.js via t.set().
      client.js downloads the file using t.getRestApi() token
      (no CORS restriction there), encodes to base64, and stores
      it under key 'previewData' in card private scope.
    */
    t.get('card', 'private', 'previewData')
      .then(function (data) {
        if (!data || !data.base64) {
          throw new Error(
            'No file data found. Please close this window and click ' +
            '"Excel Preview" again to reload the file.'
          );
        }

        /* Update label with actual stored name if available */
        if (data.name) {
          fileNameLabel.textContent = data.name;
          document.title = data.name;
        }

        /* Decode base64 → Uint8Array → SheetJS workbook */
        var bytes;
        try {
          bytes = base64ToUint8Array(data.base64);
        } catch (e) {
          throw new Error('Could not decode file data: ' + e.message);
        }

        try {
          workbook = XLSX.read(bytes, { type: 'array' });
        } catch (e) {
          throw new Error('Could not parse Excel file: ' + e.message);
        }

        if (!workbook.SheetNames || !workbook.SheetNames.length) {
          throw new Error('The file contains no sheets.');
        }

        buildTabs(workbook.SheetNames);
        renderSheet(workbook.SheetNames[0]);
      })
      .catch(function (err) {
        console.error('[ExcelPreview] Render error:', err);
        showError(err.message || 'Unknown error.');
      });
  }

  /* ── Close modal ── */
  closeBtn.addEventListener('click', function () {
    /* Clean up stored data to free card storage */
    t.remove('card', 'private', 'previewData').catch(function () {});
    t.closeModal();
  });

  /* ── Retry ── */
  retryBtn.addEventListener('click', function () {
    loadFromStorage();
  });

  /* ── Start ── */
  loadFromStorage();

})();
</script>
</body>
</html>
