<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Excel Preview</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Theme tokens — driven by Trello's data-color-mode attribute on <html>. */
    html[data-color-mode="light"], html:not([data-color-mode]) {
      --xp-bg:           #f4f5f7;
      --xp-toolbar-bg:   #ffffff;
      --xp-toolbar-bdr:  #dfe1e6;
      --xp-text:         #172b4d;
      --xp-text-subtle:  #6b778c;
      --xp-tab-bg:       #f0f1f4;
      --xp-tab-bdr:      #dfe1e6;
      --xp-tab-hover:    #e4e6ea;
      --xp-tab-text:     #5e6c84;
      --xp-cell-bg:      #ffffff;
      --xp-cell-bg-alt:  #fafbfc;
      --xp-cell-bg-hov:  #e8f5e9;
      --xp-cell-bdr:     #f0f1f4;
      --xp-shadow:       0 1px 3px rgba(0,0,0,.08);
    }
    html[data-color-mode="dark"] {
      --xp-bg:           #1d2125;
      --xp-toolbar-bg:   #22272b;
      --xp-toolbar-bdr:  #2c333a;
      --xp-text:         #b6c2cf;
      --xp-text-subtle:  #8c9bab;
      --xp-tab-bg:       #2c333a;
      --xp-tab-bdr:      #38414a;
      --xp-tab-hover:    #38414a;
      --xp-tab-text:     #b6c2cf;
      --xp-cell-bg:      #22272b;
      --xp-cell-bg-alt:  #1d2125;
      --xp-cell-bg-hov:  rgba(29,111,66,0.18);
      --xp-cell-bdr:     #2c333a;
      --xp-shadow:       0 1px 3px rgba(0,0,0,.4);
    }

    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--xp-bg);
      color: var(--xp-text);
    }

    .app { display: flex; flex-direction: column; height: 100%; }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 9px 14px; background: var(--xp-toolbar-bg);
      border-bottom: 1px solid var(--xp-toolbar-bdr); min-height: 46px;
    }
    .file-info { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
    .file-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .file-name { font-size: 14px; font-weight: 600; color: var(--xp-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { font-size: 12px; color: var(--xp-text-subtle); flex-shrink: 0; }

    /* Sheet tabs */
    .sheet-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
    .tab {
      padding: 4px 13px;
      background: var(--xp-tab-bg);
      border: 1px solid var(--xp-tab-bdr);
      border-radius: 3px; font-size: 12px;
      color: var(--xp-tab-text); cursor: pointer;
      transition: all 0.12s; white-space: nowrap;
    }
    .tab:hover { background: var(--xp-tab-hover); }
    .tab.active { background: #1D6F42; color: #fff; border-color: #1D6F42; }

    /* Table */
    .table-wrap { flex: 1; overflow: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
    #sheet-output table {
      border-collapse: collapse; background: var(--xp-cell-bg); min-width: 100%;
      box-shadow: var(--xp-shadow); font-size: 13px;
      /* Make sure the user can select & copy text from cells */
      user-select: text; -webkit-user-select: text; -moz-user-select: text;
    }
    #sheet-output tr:first-child td,
    #sheet-output th {
      background: #1D6F42; color: #fff; font-weight: 600;
      padding: 8px 12px; white-space: nowrap; position: sticky; top: 0; z-index: 2;
    }
    /* Cells: allow normal text wrapping so long invoice strings stay visible.
       Hard cap width so a single huge cell can't blow up the layout, but allow wrapping. */
    #sheet-output td {
      padding: 6px 12px;
      color: var(--xp-text);
      border-bottom: 1px solid var(--xp-cell-bdr);
      white-space: pre-wrap; word-break: break-word;
      max-width: 600px; vertical-align: top;
      user-select: text; -webkit-user-select: text;
    }
    #sheet-output tr:nth-child(even) td { background: var(--xp-cell-bg-alt); }
    #sheet-output tr:hover td { background: var(--xp-cell-bg-hov); }
    #sheet-output tr:first-child:hover td { background: #1D6F42; color: #fff; }

    /* States */
    .state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; padding: 24px; }
    .spinner { width: 38px; height: 38px; border: 4px solid var(--xp-toolbar-bdr); border-top-color: #1D6F42; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { font-size: 14px; color: var(--xp-text-subtle); text-align: center; }
    .err-icon { font-size: 44px; }
    .err-msg { font-size: 14px; color: #de350b; text-align: center; max-width: 500px; }
    .err-hint { font-size: 12px; color: var(--xp-text-subtle); text-align: center; max-width: 500px; }
    .btn { padding: 7px 16px; background: #1D6F42; color: #fff; border: none; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #165a36; }
  </style>
</head>
<body>
<div class="app">
  <!-- Loading -->
  <div id="s-loading" class="state">
    <div class="spinner"></div>
    <div class="state-text" id="loading-msg">Завантаження файлу...</div>
  </div>

  <!-- Error -->
  <div id="s-error" class="state" style="display:none">
    <div class="err-icon">⚠️</div>
    <div class="err-msg" id="err-msg"></div>
    <div class="err-hint" id="err-hint"></div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" id="btn-retry">Спробувати знову</button>
      <button class="btn" id="btn-reauth" style="display:none;">Переавторизуватись</button>
    </div>
  </div>

  <!-- Content -->
  <div id="s-content" style="display:none; flex:1; min-height:0; flex-direction:column;">
    <div class="toolbar">
      <div class="file-info">
        <svg class="file-icon" viewBox="0 0 24 24" fill="#1D6F42">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
          <path d="M14 2v6h6" fill="#a5d6a7"/>
        </svg>
        <span class="file-name" id="fname"></span>
        <span class="file-size" id="fsize"></span>
      </div>
      <div class="sheet-tabs" id="tabs"></div>
    </div>
    <div class="table-wrap">
      <div id="sheet-output"></div>
    </div>
  </div>
</div>

<script>
(function() {
  var PROXY_DEFAULT = 'https://trello-excel-viewer.vercel.app';
  // Спочатку ініціалізуємо без appKey (sync) — щоб відразу мати t.arg() і не втратити handshake.
  var t = TrelloPowerUp.iframe({ appName: 'Excel Preview' });

  // Але для getRestApi (reauth) потрібен appKey — підвантажуємо його ліниво з /api/config
  // і переініціалізуємо iframe (безпечно: це singleton).
  var appKeyPromise = (function() {
    try {
      var proxy = (function() { try { return t.arg('proxy') || PROXY_DEFAULT; } catch(_) { return PROXY_DEFAULT; } })();
      return fetch(proxy + '/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
        if (cfg && cfg.appKey) {
          try { TrelloPowerUp.iframe({ appKey: cfg.appKey, appName: cfg.appName || 'Excel Preview' }); } catch(e) {}
          return cfg.appKey;
        }
        return '';
      }).catch(function() { return ''; });
    } catch(e) { return Promise.resolve(''); }
  })();

  var wb = null;

  function show(id) {
    ['s-loading','s-error','s-content'].forEach(function(s) {
      var el = document.getElementById(s);
      el.style.display = (s === id) ? 'flex' : 'none';
    });
  }

  function setLoading(msg) {
    show('s-loading');
    document.getElementById('loading-msg').textContent = msg || 'Завантаження...';
  }

  function setError(msg, hint, opts) {
    show('s-error');
    document.getElementById('err-msg').textContent = msg || 'Помилка';
    document.getElementById('err-hint').textContent = hint || '';
    var reauthBtn = document.getElementById('btn-reauth');
    if (reauthBtn) reauthBtn.style.display = (opts && opts.showReauth) ? 'inline-block' : 'none';
  }

  function reauthorizeAndReload() {
    setLoading('Запит авторизації...');
    // Чекаємо на appKey — без нього getRestApi() кидає помилку
    appKeyPromise.then(function(appKey) {
      if (!appKey) {
        setError('Не вдалося отримати appKey',
                 'Перевірте доступність /api/config на Vercel.', { showReauth: true });
        return;
      }
      try {
        var api = t.getRestApi();
        var p = api.clearToken ? Promise.resolve(api.clearToken()) : Promise.resolve();
        p.then(function() {
          return api.authorize({ scope: 'read', expiration: 'never' });
        }).then(function() {
          return api.getToken();
        }).then(function(newToken) {
          if (!newToken) {
            setError('Не вдалось авторизуватись', 'Спробуйте ще раз.', { showReauth: true });
            return;
          }
          modalArgs.token = newToken;
          loadFile();
        }).catch(function(err) {
          setError('Помилка авторизації', (err && err.message) || 'Невідома помилка', { showReauth: true });
        });
      } catch(e) {
        setError('Помилка авторизації', e.message, { showReauth: true });
      }
    });
  }

  function fmtBytes(b) {
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  function renderSheet(name) {
    var ws = wb.Sheets[name];
    var out = document.getElementById('sheet-output');
    // Render in a microtask so the spinner/UI gets a chance to repaint before we block.
    out.innerHTML = '<div style="padding:24px;color:#5e6c84;font-size:13px">Рендеримо аркуш &laquo;' + name + '&raquo;...</div>';
    document.querySelectorAll('#tabs .tab').forEach(function(tab) {
      tab.classList.toggle('active', tab.dataset.sheet === name);
    });
    setTimeout(function() {
      try {
        out.innerHTML = XLSX.utils.sheet_to_html(ws, { editable: false });
      } catch(e) {
        out.innerHTML = '<div style="padding:24px;color:#de350b;font-size:13px">Не вдалося відрендерити аркуш: ' + (e.message || e) + '</div>';
      }
    }, 0);
  }

  function buildTabs() {
    var container = document.getElementById('tabs');
    container.innerHTML = '';
    wb.SheetNames.forEach(function(n) {
      var tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.sheet = n;
      tab.textContent = n;
      tab.addEventListener('click', function() { renderSheet(n); });
      container.appendChild(tab);
    });
  }

  // ── Fetch file via server-side attachment endpoint ──
  function fetchAttachment(cardId, attachmentId, token, proxy) {
    return new Promise(function(resolve, reject) {
      var url = proxy + '/api/attachment' +
                '?cardId=' + encodeURIComponent(cardId) +
                '&attachmentId=' + encodeURIComponent(attachmentId) +
                (token ? '&token=' + encodeURIComponent(token) : '');

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.timeout = 45000;

      xhr.onload = function() {
        if (xhr.status === 200) { resolve(xhr.response); return; }
        var errMsg = 'HTTP ' + xhr.status;
        try {
          var body = new TextDecoder('utf-8').decode(new Uint8Array(xhr.response));
          var parsed = JSON.parse(body);
          if (parsed.error) errMsg = parsed.error;
          if (parsed.details) errMsg += ' (' + parsed.details + ')';
        } catch(e) {}
        reject(new Error(errMsg));
      };
      xhr.onerror   = function() { reject(new Error('Мережева помилка')); };
      xhr.ontimeout = function() { reject(new Error('Таймаут 45с')); };
      xhr.send();
    });
  }

  // ── Legacy fallback: fetch via generic URL proxy ──
  function fetchViaUrlProxy(attUrl, token, proxy) {
    return new Promise(function(resolve, reject) {
      var url = proxy + '/api/proxy?url=' + encodeURIComponent(attUrl);
      if (token) url += '&token=' + encodeURIComponent(token);

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.timeout = 45000;

      xhr.onload = function() {
        if (xhr.status === 200) { resolve(xhr.response); return; }
        var errMsg = 'HTTP ' + xhr.status;
        try {
          var body = new TextDecoder('utf-8').decode(new Uint8Array(xhr.response));
          var parsed = JSON.parse(body);
          if (parsed.error) errMsg = parsed.error;
        } catch(e) {}
        reject(new Error(errMsg));
      };
      xhr.onerror   = function() { reject(new Error('Мережева помилка')); };
      xhr.ontimeout = function() { reject(new Error('Таймаут 45с')); };
      xhr.send();
    });
  }

  // Зберігаємо args modal у зовнішньому скоупі — щоб reauth міг підмінити token
  var modalArgs = {
    attUrl:  t.arg('url'),
    attName: t.arg('name') || 'Excel файл',
    attId:   t.arg('id') || '',
    cardId:  t.arg('cardId') || '',
    token:   t.arg('token') || '',
    proxy:   t.arg('proxy') || 'https://trello-excel-viewer.vercel.app'
  };

  window.loadFile = function loadFile() {
    var attUrl  = modalArgs.attUrl;
    var attName = modalArgs.attName;
    var attId   = modalArgs.attId;
    var cardId  = modalArgs.cardId;
    var token   = modalArgs.token;
    var proxy   = modalArgs.proxy;

    document.getElementById('fname').textContent = attName;
    setLoading('Завантаження ' + attName + '...');

    var fetchPromise;
    if (cardId && attId) {
      fetchPromise = fetchAttachment(cardId, attId, token, proxy);
    } else if (attUrl) {
      fetchPromise = fetchViaUrlProxy(attUrl, token, proxy);
    } else {
      setError('Не вистачає даних про файл.', 'Закрийте та відкрийте preview знову.');
      return;
    }

    // Safety net: show error after 50s if still loading
    var safetyTimer = setTimeout(function() {
      var loading = document.getElementById('s-loading');
      if (loading && loading.style.display !== 'none') {
        setError('Таймаут', 'Завантаження триває надто довго. Спробуйте ще раз.');
      }
    }, 50000);

    fetchPromise.then(function(buffer) {
      clearTimeout(safetyTimer);
      setLoading('Читаємо файл...');
      // Yield to the browser so the spinner repaints before XLSX.read() blocks main thread.
      setTimeout(function() {
        try {
          var data = new Uint8Array(buffer);
          document.getElementById('fsize').textContent = fmtBytes(data.byteLength);
          wb = XLSX.read(data, { type: 'array' });
          if (!wb.SheetNames || !wb.SheetNames.length) {
            setError('Файл не містить аркушів.', 'Можливо, файл пошкоджений.');
            return;
          }
          buildTabs();
          show('s-content');
          renderSheet(wb.SheetNames[0]);
        } catch(e) {
          setError('Не вдалося прочитати файл.', e.message);
        }
      }, 30);
    }).catch(function(err) {
      clearTimeout(safetyTimer);
      var msg = (err && err.message) ? err.message : 'Невідома помилка';
      var lower = String(msg).toLowerCase();
      var isAuth = lower.indexOf('401') !== -1 ||
                   lower.indexOf('unauthor') !== -1 ||
                   lower.indexOf('missing scope') !== -1 ||
                   lower.indexOf('invalid token') !== -1;
      if (isAuth) {
        setError('Потрібна авторизація Trello',
                 'Токен не має потрібного доступу (read). Натисніть «Переавторизуватись».',
                 { showReauth: true });
      } else {
        setError('Помилка завантаження', msg);
      }
    });
  };

  // Обробники кнопок помилки
  document.getElementById('btn-retry').addEventListener('click', function() { loadFile(); });
  document.getElementById('btn-reauth').addEventListener('click', function() { reauthorizeAndReload(); });

  loadFile();
})();
</script>
</body>
</html>
